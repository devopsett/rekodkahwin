<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard Tabung Kahwin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ec4899;
      --primary-dark: #be185d;
      --bg-dark: #0f172a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding-bottom: 30px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .top-bar h1 {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      color: var(--text-main);
    }
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #dcfce7;
      color: #15803d;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 20px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Hero Dashboard Card */
    .hero-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 22px 20px;
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      top: -20px;
      right: -20px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(236,72,153,0) 70%);
      border-radius: 50%;
    }
    .hero-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
    }
    .hero-balance {
      font-size: 32px;
      font-weight: 800;
      margin: 4px 0 12px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    /* Progress Target */
    .progress-box { margin-bottom: 14px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    .progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ec4899, #f43f5e); border-radius: 10px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Grid Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #ffffff;
      padding: 14px 16px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
    }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 16px; font-weight: 800; color: var(--text-main); margin-top: 3px; }

    /* Form Container */
    .form-card {
      background: #ffffff;
      padding: 22px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
      border: 1px solid #f1f5f9;
      margin-bottom: 14px;
    }
    .form-card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 800; color: var(--text-main); }
    .form-group { margin-bottom: 13px; }
    label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    
    .input-field, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus, select:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.12);
    }

    .currency-wrap { position: relative; }
    .currency-tag { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 800; color: #94a3b8; font-size: 14px; }
    .currency-wrap input { padding-left: 44px; font-weight: 800; font-size: 16px; color: var(--text-main); }

    /* Action Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #25d366 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.28);
      transition: 0.2s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:active { transform: scale(0.98); }

    /* Recent Transactions Card */
    .recent-card {
      background: #ffffff;
      padding: 18px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
      border: 1px solid #f1f5f9;
    }
    .recent-card h4 { margin: 0 0 12px; font-size: 14px; font-weight: 800; color: var(--text-main); }
    .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f8fafc; }
    .recent-item:last-child { border-bottom: none; }
    .item-name { font-weight: 700; font-size: 13px; color: #1e293b; }
    .item-tag { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .item-amount { font-weight: 800; font-size: 14px; color: var(--emerald); }

    /* Main Page Overlay Screen */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      animation: fadeInOverlay 0.2s ease-out;
    }
    @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }

    .loading-box {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 28px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 300px;
      width: 100%;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; color: #ffffff; }
    .loading-desc { font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- TOP BAR -->
  <div class="top-bar">
    <h1>💍 Tabung Kahwin</h1>
    <span class="live-indicator"><span class="pulse-dot"></span> Live Sync</span>
  </div>

  <!-- HERO DASHBOARD -->
  <div class="hero-card">
    <div class="hero-title">Jumlah Tabung Terkumpul</div>
    <div class="hero-balance" id="uiTotal">RM 0.00</div>
    
    <div class="progress-box">
      <div class="progress-info">
        <span>Sasaran: RM <span id="uiTarget">20,000.00</span></span>
        <span id="uiPeratus">0.0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="uiProgressFill"></div>
      </div>
    </div>
  </div>

  <!-- STATS GRID -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">👨 Pihak Lelaki</div>
      <div class="stat-value" id="uiLelaki" style="color:#2563eb;">RM 0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">👩 Pihak Perempuan</div>
      <div class="stat-value" id="uiPerempuan" style="color:#db2777;">RM 0.00</div>
    </div>
  </div>

  <!-- BORANG SIMPAN REKOD -->
  <div class="form-card">
    <h3>➕ Tambah Simpanan Duit</h3>
    <form id="recordForm" onsubmit="hantarRekod(event)">
      
      <div class="form-group">
        <label>Penyumbang</label>
        <select id="nama" required>
          <option value="" disabled selected>Pilih penyumbang...</option>
          <option value="Pengantin Lelaki">Pengantin Lelaki</option>
          <option value="Pengantin Perempuan">Pengantin Perempuan</option>
          <option value="Hadiah Keluarga">Hadiah Keluarga</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>

      <div class="form-group">
        <label>Jumlah Masuk (RM)</label>
        <div class="currency-wrap">
          <span class="currency-tag">RM</span>
          <input type="number" step="0.01" min="0.01" id="jumlah" placeholder="0.00" required>
        </div>
      </div>

      <div class="form-group">
        <label>Kategori Peruntukan</label>
        <select id="kategori" required>
          <option value="Simpanan Asas">Simpanan Asas</option>
          <option value="Katering & Jamuan">Katering & Jamuan</option>
          <option value="Pelamin & Busana">Pelamin & Busana</option>
          <option value="Fotografi / Video">Fotografi / Video</option>
          <option value="Cincin & Batal Air Sembahyang">Cincin & Batal Air Sembahyang</option>
          <option value="Cenderahati & Kad">Cenderahati & Kad</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kaedah Transaksi</label>
        <select id="kaedah" required>
          <option value="Online Transfer">Online Transfer</option>
          <option value="Duit Tunai">Duit Tunai</option>
          <option value="Deposit Mesin (CDM)">Deposit Mesin (CDM)</option>
          <option value="ASB / Tabung Haji">ASB / Tabung Haji</option>
        </select>
      </div>

      <div class="form-group">
        <label>Catatan (Pilihan)</label>
        <input type="text" id="catatan" class="input-field" placeholder="Contoh: Simpanan gaji">
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">
        <span>📲</span> Simpan & Buka WhatsApp
      </button>
    </form>
  </div>

  <!-- SENARAI REKOD TERKINI -->
  <div class="recent-card">
    <h4>📋 Rekod Transaksi Terkini</h4>
    <div id="uiRecentList">
      <div style="color: #94a3b8; font-size: 13px; text-align: center; padding: 12px 0;">Memuatkan data...</div>
    </div>
  </div>

</div>

<!-- LOADING OVERLAY UTAMA -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-title" id="loadingTitle">Menyimpan Rekod...</div>
    <div class="loading-desc" id="loadingDesc">Sila tunggu, rekod sedang dikemas kini ke Sheet.</div>
  </div>
</div>

<script>
  // =========================================================================
  // URL WEB APP APPS SCRIPT ANDA & NOMBOR WHATSAPP
  // =========================================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymHn9GoYR0Sc0_PyPqfWfiGYVIZBcPdCV7Tos-PEa087PVj7ZmtGKMggj3IqSrMUk/exec";
  const NO_WHATSAPP = "60105350291";

  // Muat turun data dashboard sebaik sahaja halaman dibuka di GitHub
  window.addEventListener('DOMContentLoaded', () => {
    fetchDashboardData();
  });

  function fetchDashboardData() {
    fetch(APPS_SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        if (data && data.status === "success") {
          updateDashboardUI(data);
        }
      })
      .catch(err => {
        console.error("Gagal memuatkan data:", err);
      });
  }

  function updateDashboardUI(data) {
    if (!data) return;
    document.getElementById("uiTotal").innerText = "RM " + (data.totalAll || "0.00");
    document.getElementById("uiLelaki").innerText = "RM " + (data.totalLelaki || "0.00");
    document.getElementById("uiPerempuan").innerText = "RM " + (data.totalPerempuan || "0.00");
    document.getElementById("uiTarget").innerText = data.targetSasaran || "20,000.00";
    
    const pct = data.peratus || "0.0";
    document.getElementById("uiPeratus").innerText = pct + "%";
    document.getElementById("uiProgressFill").style.width = pct + "%";

    const listDiv = document.getElementById("uiRecentList");
    if (data.senaraiTerkini && data.senaraiTerkini.length > 0) {
      let html = "";
      for (let i = 0; i < data.senaraiTerkini.length; i++) {
        const itm = data.senaraiTerkini[i];
        html += `<div class="recent-item">
                  <div>
                    <div class="item-name">${itm.nama}</div>
                    <div class="item-tag">${itm.kategori} • ${itm.tarikh}</div>
                  </div>
                  <div class="item-amount">+RM ${itm.jumlah}</div>
                </div>`;
      }
      listDiv.innerHTML = html;
    } else {
      listDiv.innerHTML = `<div style="color: #94a3b8; font-size: 13px; text-align: center; padding: 10px 0;">Belum ada sebarang rekod.</div>`;
    }
  }

  function hantarRekod(e) {
    e.preventDefault();

    const overlay = document.getElementById("loadingOverlay");
    const loadTitle = document.getElementById("loadingTitle");
    const loadDesc = document.getElementById("loadingDesc");

    const nama = document.getElementById("nama").value;
    const jumlah = document.getElementById("jumlah").value;
    const kategori = document.getElementById("kategori").value;
    const kaedah = document.getElementById("kaedah").value;
    const catatan = document.getElementById("catatan").value;

    // 1. BUKA TAB BAHARU
    const waWindow = window.open("", "_blank");

    // 2. SUNTIK SPLASH LOADING SCREEN KE DALAM TAB BAHARU SUPAYA TIDAK BLANK
    if (waWindow) {
      waWindow.document.write(`
        <!DOCTYPE html>
        <html lang="ms">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Membuka WhatsApp...</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
          <style>
            * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
            body {
              background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
              color: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              height: 100vh;
              margin: 0;
              padding: 20px;
              text-align: center;
            }
            .splash-card {
              background: rgba(255, 255, 255, 0.05);
              backdrop-filter: blur(12px);
              border: 1px solid rgba(255, 255, 255, 0.12);
              padding: 36px 26px;
              border-radius: 26px;
              box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
              max-width: 340px;
              width: 100%;
            }
            .spinner-ring {
              width: 52px;
              height: 52px;
              border: 4px solid rgba(255, 255, 255, 0.15);
              border-top-color: #25d366;
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
              margin: 0 auto 20px;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
            h2 { font-size: 18px; font-weight: 800; margin: 0 0 6px; }
            p { font-size: 13px; color: #94a3b8; margin: 0 0 16px; }
            .badge-wa {
              display: inline-flex;
              align-items: center;
              gap: 6px;
              background: rgba(37, 211, 102, 0.15);
              color: #25d366;
              font-size: 12px;
              font-weight: 700;
              padding: 6px 14px;
              border-radius: 20px;
              border: 1px solid rgba(37, 211, 102, 0.3);
            }
          </style>
        </head>
        <body>
          <div class="splash-card">
            <div class="spinner-ring"></div>
            <h2>Menyediakan WhatsApp...</h2>
            <p>Rekod sedang disimpan ke Google Sheet. Anda akan dipindahkan ke WhatsApp sebentar lagi.</p>
            <div class="badge-wa">📲 010-5350291</div>
          </div>
        </body>
        </html>
      `);
      waWindow.document.close();
    }

    // 3. Paparkan loading overlay pada halaman utama
    loadTitle.innerText = "Menyimpan Rekod...";
    loadDesc.innerText = "Sila tunggu, rekod sedang dikemas kini ke Sheet.";
    overlay.style.display = "flex";

    const payload = {
      nama: nama,
      jumlah: jumlah,
      kategori: kategori,
      kaedah: kaedah,
      catatan: catatan
    };

    // 4. Hantar data ke Google Apps Script Web App
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res && res.status === "success") {
        updateDashboardUI(res.metrics);

        const amtFormatted = parseFloat(jumlah).toLocaleString('en-MY', { minimumFractionDigits: 2 });
        
        const message = `💍 *REKOD TABUNG KAHWIN MASUK* 💍\n\n` +
                        `🆔 *ID:* \`${res.transId}\`\n` +
                        `👤 *Penyumbang:* ${nama}\n` +
                        `💵 *Jumlah Masuk:* RM ${amtFormatted}\n` +
                        `📂 *Kategori:* ${kategori}\n` +
                        `💳 *Kaedah:* ${kaedah}\n` +
                        `📝 *Catatan:* ${catatan || '-'}\n` +
                        `⏰ *Masa:* ${res.timestamp}\n\n` +
                        `──────────────────────\n` +
                        `💰 *JUMLAH TERKUMPUL:* *RM ${res.metrics.totalAll}*\n` +
                        `🎯 *KEMAJUAN SASARAN:* ${res.metrics.peratus}%\n` +
                        `👨 Lelaki: RM ${res.metrics.totalLelaki}\n` +
                        `👩 Perempuan: RM ${res.metrics.totalPerempuan}\n` +
                        `──────────────────────\n` +
                        `_Alhamdulillah, rekod berjaya dikemaskini!_ ✨`;

        const waUrl = `https://wa.me/${NO_WHATSAPP}?text=${encodeURIComponent(message)}`;

        // 5. Buka pautan WhatsApp pada tetingkap splash screen tadi
        if (waWindow) {
          waWindow.location.href = waUrl;
        }

        // Tutup loading overlay dan reset input
        setTimeout(() => {
          overlay.style.display = "none";
          document.getElementById("jumlah").value = "";
          document.getElementById("catatan").value = "";
        }, 800);

      } else {
        if (waWindow) waWindow.close();
        overlay.style.display = "none";
        alert("Gagal simpan: " + (res ? res.message : "Ralat"));
      }
    })
    .catch(err => {
      if (waWindow) waWindow.close();
      overlay.style.display = "none";
      alert("Ralat penghantaran ke API: " + err.message);
    });
  }
</script>

</body>
</html>
