<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>wedding-fund // repo</title>
  <!-- GitHub Font: SF Mono, Segoe UI, Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gh-bg: #0d1117;
      --gh-canvas: #010409;
      --gh-subtle: #161b22;
      --gh-border: #30363d;
      --gh-text: #e6edf3;
      --gh-muted: #8b949e;
      --gh-link: #58a6ff;
      --gh-green: #238636;
      --gh-green-hover: #2ea043;
      --gh-purple: #a371f7;
      --gh-pink: #f778ba;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--gh-bg);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: var(--gh-text);
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    /* GitHub Repository Header */
    .repo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 16px;
      border-bottom: 1px solid var(--gh-border);
      margin-bottom: 16px;
    }

    .repo-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-family: 'Fira Code', monospace;
      color: var(--gh-muted);
    }

    .repo-title a {
      color: var(--gh-link);
      text-decoration: none;
      font-weight: 700;
    }

    .badge-public {
      border: 1px solid var(--gh-border);
      background: var(--gh-subtle);
      color: var(--gh-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
    }

    /* Hero Metrics Block */
    .gh-box {
      background-color: var(--gh-subtle);
      border: 1px solid var(--gh-border);
      border-radius: 6px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .gh-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .gh-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gh-muted);
      font-family: 'Fira Code', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .total-amount {
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin: 4px 0 14px;
      font-family: 'Fira Code', monospace;
    }

    /* GitHub Language-style Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #238636;
      border-radius: 6px;
      transition: width 0.8s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gh-muted);
      font-family: 'Fira Code', monospace;
    }

    /* Split Contributions */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--gh-border);
    }

    .split-box {
      background: var(--gh-bg);
      border: 1px solid var(--gh-border);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .split-title {
      font-size: 11px;
      color: var(--gh-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .dot-male { width: 8px; height: 8px; border-radius: 50%; background: var(--gh-link); }
    .dot-female { width: 8px; height: 8px; border-radius: 50%; background: var(--gh-pink); }

    .split-val {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 4px;
      font-family: 'Fira Code', monospace;
    }

    /* GitHub Issue/PR Form Style */
    .card-title-bar {
      font-size: 13px;
      font-weight: 700;
      color: var(--gh-text);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-family: 'Fira Code', monospace;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gh-text);
      margin-bottom: 6px;
    }

    .input-field, select {
      width: 100%;
      background-color: var(--gh-canvas);
      border: 1px solid var(--gh-border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--gh-text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus, select:focus {
      border-color: var(--gh-link);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    .currency-wrap {
      position: relative;
    }

    .currency-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 700;
      color: var(--gh-muted);
      font-family: 'Fira Code', monospace;
    }

    .currency-wrap input {
      padding-left: 42px;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
    }

    /* GitHub Primary Action Button */
    .btn-gh {
      width: 100%;
      background-color: var(--gh-green);
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
      margin-top: 6px;
    }

    .btn-gh:hover {
      background-color: var(--gh-green-hover);
    }

    .btn-gh:active {
      transform: scale(0.99);
    }

    /* Recent Commits List */
    .commit-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--gh-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 10px;
      font-family: 'Fira Code', monospace;
    }

    .commit-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .commit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--gh-border);
      font-size: 12px;
    }

    .commit-item:last-child {
      border-bottom: none;
    }

    .commit-desc {
      font-weight: 600;
      color: var(--gh-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .commit-tag {
      font-size: 11px;
      color: var(--gh-muted);
      margin-top: 2px;
      font-family: 'Fira Code', monospace;
    }

    .commit-amt {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      color: #3fb950;
      text-align: right;
    }

    /* GitHub-style Loading Overlay */
    .gh-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(1, 4, 9, 0.85);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: var(--gh-text);
      text-align: center;
      padding: 20px;
    }

    .gh-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(139, 148, 158, 0.2);
      border-top-color: var(--gh-link);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .gh-overlay-title {
      font-size: 14px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      margin-bottom: 4px;
    }

    .gh-overlay-desc {
      font-size: 12px;
      color: var(--gh-muted);
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- REPO HEADER -->
  <div class="repo-header">
    <div class="repo-title">
      <span>📁</span>
      <a href="#">wedding-fund</a> / <span>main</span>
    </div>
    <span class="badge-public">Public</span>
  </div>

  <!-- DASHBOARD BOX -->
  <div class="gh-box">
    <div class="gh-box-header">
      <span class="gh-label">⚡ TOTAL_COMMITTED</span>
      <span style="font-size: 11px; color: var(--gh-muted); font-family:'Fira Code', monospace;">target: RM <span id="uiTarget">20,000.00</span></span>
    </div>
    <div class="total-amount" id="uiTotal">RM 0.00</div>

    <div class="progress-track">
      <div class="progress-fill" id="uiProgressFill"></div>
    </div>
    <div class="progress-meta">
      <span>Progress</span>
      <span id="uiPeratus">0.0%</span>
    </div>

    <div class="split-grid">
      <div class="split-box">
        <div class="split-title"><span class="dot-male"></span> Pihak Lelaki</div>
        <div class="split-val" id="uiLelaki">RM 0.00</div>
      </div>
      <div class="split-box">
        <div class="split-title"><span class="dot-female"></span> Pihak Perempuan</div>
        <div class="split-val" id="uiPerempuan">RM 0.00</div>
      </div>
    </div>
  </div>

  <!-- FORM CONTAINER -->
  <div class="gh-box">
    <div class="card-title-bar">
      <span>📝</span> create new contribution
    </div>
    <form id="recordForm" onsubmit="hantarRekodGitHub(event)">
      
      <div class="form-group">
        <label>Author / Penyumbang</label>
        <select id="nama" required>
          <option value="" disabled selected>Pilih penyumbang...</option>
          <option value="Pengantin Lelaki">Pengantin Lelaki</option>
          <option value="Pengantin Perempuan">Pengantin Perempuan</option>
          <option value="Hadiah Keluarga">Hadiah Keluarga</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>

      <div class="form-group">
        <label>Amount (RM)</label>
        <div class="currency-wrap">
          <span class="currency-prefix">RM</span>
          <input type="number" step="0.01" min="0.01" id="jumlah" class="input-field" placeholder="0.00" required>
        </div>
      </div>

      <div class="form-group">
        <label>Category Label</label>
        <select id="kategori" required>
          <option value="Simpanan Asas">Simpanan Asas</option>
          <option value="Katering & Jamuan">Katering & Jamuan</option>
          <option value="Pelamin & Busana">Pelamin & Busana</option>
          <option value="Fotografi / Video">Fotografi / Video</option>
          <option value="Cincin & Batal Air Sembahyang">Cincin & Batal Air Sembahyang</option>
          <option value="Cenderahati & Kad">Cenderahati & Kad</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select id="kaedah" required>
          <option value="Online Transfer">Online Transfer</option>
          <option value="Duit Tunai">Duit Tunai</option>
          <option value="Deposit Mesin (CDM)">Deposit Mesin (CDM)</option>
          <option value="ASB / Tabung Haji">ASB / Tabung Haji</option>
        </select>
      </div>

      <div class="form-group">
        <label>Commit Message / Catatan</label>
        <input type="text" id="catatan" class="input-field" placeholder="e.g. Duit lebihan gaji bulan ini">
      </div>

      <button type="submit" id="btnSubmit" class="btn-gh">
        <span>🚀</span> Commit & Open WhatsApp
      </button>
    </form>
  </div>

  <!-- RECENT COMMITS -->
  <div class="gh-box">
    <div class="commit-header">📜 Recent Commits</div>
    <div id="uiRecentList">
      <div style="color: var(--gh-muted); font-size: 12px; text-align: center; padding: 12px 0; font-family:'Fira Code', monospace;">
        Fetching commits...
      </div>
    </div>
  </div>

</div>

<!-- LOADING OVERLAY -->
<div class="gh-overlay" id="loadingOverlay">
  <div class="gh-spinner"></div>
  <div class="gh-overlay-title" id="loadingTitle">pushing_to_sheet...</div>
  <div class="gh-overlay-desc" id="loadingDesc">Writing transaction logs to remote database.</div>
</div>

<script>
  // Nombor WhatsApp Sasaran Rasmi
  const NO_WHATSAPP = "60105350291";

  window.onload = function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.status === "success") {
          updateDashboardUI(res);
        }
      })
      .getDashboardMetrics();
  };

  function updateDashboardUI(data) {
    if (!data) return;
    document.getElementById("uiTotal").innerText = "RM " + (data.totalAll || "0.00");
    document.getElementById("uiLelaki").innerText = "RM " + (data.totalLelaki || "0.00");
    document.getElementById("uiPerempuan").innerText = "RM " + (data.totalPerempuan || "0.00");
    document.getElementById("uiTarget").innerText = data.targetSasaran || "20,000.00";
    
    const pct = data.peratus || "0.0";
    document.getElementById("uiPeratus").innerText = pct + "%";
    document.getElementById("uiProgressFill").style.width = pct + "%";

    const listDiv = document.getElementById("uiRecentList");
    if (data.senaraiTerkini && data.senaraiTerkini.length > 0) {
      let html = '<ul class="commit-list">';
      for (let i = 0; i < data.senaraiTerkini.length; i++) {
        const itm = data.senaraiTerkini[i];
        html += `
          <li class="commit-item">
            <div>
              <div class="commit-desc"><span>📦</span> ${itm.nama}</div>
              <div class="commit-tag">${itm.kategori} • ${itm.tarikh}</div>
            </div>
            <div class="commit-amt">+RM ${itm.jumlah}</div>
          </li>`;
      }
      html += '</ul>';
      listDiv.innerHTML = html;
    } else {
      listDiv.innerHTML = '<div style="color: var(--gh-muted); font-size: 12px; text-align: center; padding: 10px 0; font-family:\'Fira Code\', monospace;">No commit history.</div>';
    }
  }

  function hantarRekodGitHub(e) {
    e.preventDefault();

    const overlay = document.getElementById("loadingOverlay");
    const loadTitle = document.getElementById("loadingTitle");
    const loadDesc = document.getElementById("loadingDesc");

    const nama = document.getElementById("nama").value;
    const jumlah = document.getElementById("jumlah").value;
    const kategori = document.getElementById("kategori").value;
    const kaedah = document.getElementById("kaedah").value;
    const catatan = document.getElementById("catatan").value;

    // 1. Sediakan tab awal untuk elak popup blocker pelayar
    const waWindow = window.open("about:blank", "_blank");

    // 2. Aktifkan Loading Screen GitHub Style
    loadTitle.innerText = "git push origin main...";
    loadDesc.innerText = "Saving records to Google Sheets database.";
    overlay.style.display = "flex";

    // 3. Simpan data ke Google Sheet
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.status === "success") {
          loadTitle.innerText = "redirecting_to_whatsapp...";
          loadDesc.innerText = "Generating draft payload message.";

          updateDashboardUI(res.metrics);

          const amtFormatted = parseFloat(jumlah).toLocaleString('en-MY', { minimumFractionDigits: 2 });
          
          const message = `💍 *REKOD TABUNG KAHWIN MASUK* 💍\n\n` +
                          `🆔 *ID:* \`${res.transId}\`\n` +
                          `👤 *Penyumbang:* ${nama}\n` +
                          `💵 *Jumlah Masuk:* RM ${amtFormatted}\n` +
                          `📂 *Kategori:* ${kategori}\n` +
                          `💳 *Kaedah:* ${kaedah}\n` +
                          `📝 *Catatan:* ${catatan || '-'}\n` +
                          `⏰ *Masa:* ${res.timestamp}\n\n` +
                          `──────────────────────\n` +
                          `💰 *JUMLAH TERKUMPUL:* *RM ${res.metrics.totalAll}*\n` +
                          `🎯 *KEMAJUAN SASARAN:* ${res.metrics.peratus}%\n` +
                          `👨 Lelaki: RM ${res.metrics.totalLelaki}\n` +
                          `👩 Perempuan: RM ${res.metrics.totalPerempuan}\n` +
                          `──────────────────────\n` +
                          `_Alhamdulillah, rekod berjaya dikemaskini!_ ✨`;

          const waUrl = `https://wa.me/${NO_WHATSAPP}?text=${encodeURIComponent(message)}`;

          if (waWindow) {
            waWindow.location.href = waUrl;
          }

          setTimeout(function() {
            overlay.style.display = "none";
            document.getElementById("jumlah").value = "";
            document.getElementById("catatan").value = "";
          }, 800);

        } else {
          if (waWindow) waWindow.close();
          overlay.style.display = "none";
          alert("Gagal simpan: " + (res ? res.message : "Ralat tidak diketahui"));
        }
      })
      .withFailureHandler(function(err) {
        if (waWindow) waWindow.close();
        overlay.style.display = "none";
        alert("Ralat sambungan: " + err.message);
      })
      .simpanRekodCepat(nama, jumlah, kategori, kaedah, catatan);
  }
</script>

</body>
</html>
