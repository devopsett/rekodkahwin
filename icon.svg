<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>
  
  <!-- Latar Belakang Kotak Bulat App -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Cincin 1 (Kiri) -->
  <circle cx="210" cy="290" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="32" />
  
  <!-- Cincin 2 (Kanan - Bersilang) -->
  <circle cx="302" cy="290" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="32" />
  
  <!-- Permata Berlian Atas Cincin -->
  <polygon points="210,120 250,165 210,210 170,165" fill="url(#gemGrad)" />
  <polygon points="210,120 230,165 210,210 190,165" fill="#ffffff" opacity="0.6" />
</svg>
